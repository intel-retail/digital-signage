name: "[Digital Signage] PR workflow"
run-name: "[Digital Signage] PR  workflow (by @${{ github.actor }} via ${{ github.event_name }})"
on:
  push:
    branches:
      - 'main'
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_call:
  workflow_dispatch:
  
permissions:
  contents: read
  packages: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  digital-signage-unit-tests:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: |
        cd "${{ github.workspace }}"
        pip3 install -r web-ui/requirements.txt -r web-ui/requirements-test.txt
        pip3 install -r aig/src/requirements-test.txt
    - name: Run unit tests (web-ui + aig)
      run: |
        cd "${{ github.workspace }}"
        python3 -m pytest -v

  digital-signage-pre-merge-build:
    permissions:
      contents: read
      packages: read          # needed for actions/checkout
    runs-on: ubuntu-24.04
    steps:
    - name: Runner workspace path
      run: |
        echo "Cleaning up previous run"
        if [ -n "$(docker ps -aq)" ]; then
            docker stop $(docker ps -aq)
        fi
        if [ -n "$(docker ps -aq)" ]; then
            docker rm $(docker ps -aq)
        fi
        docker images --quiet --filter=dangling=true | xargs --no-run-if-empty docker rmi -f
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    - name: Build
      run: |
        cd "${{ github.workspace }}"
        make down
        # Generate random values for sensitive environment variables
        MTX_WEBRTCICESERVERS2_0_USERNAME=$(tr -dc 'a-zA-Z' < /dev/urandom | head -c 8)
        MTX_WEBRTCICESERVERS2_0_PASSWORD=$(openssl rand -hex 10)
        HOST_IP=$(hostname -I | awk '{print $1}')

        sed -i "s/MTX_WEBRTCICESERVERS2_0_USERNAME=.*/MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME}/g" .env
        sed -i "s/MTX_WEBRTCICESERVERS2_0_PASSWORD=.*/MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD}/g" .env
        sed -i "s/HOST_IP=.*/HOST_IP=${HOST_IP}/g" .env
        make build
    - name: Download models
      run: |
        cd "${{ github.workspace }}"
        echo "Downloading PID (YOLO11s) model"
        cd configs/pid && \
        wget https://raw.githubusercontent.com/intel-retail/automated-self-checkout/v3.6.3/download_models/downloadAndQuantizeModel.sh && \
        sed -i 's|MODELS_PATH="${MODELS_DIR:-/workspace/models}"|MODELS_PATH="${MODELS_DIR:-$PWD/models}"|g' downloadAndQuantizeModel.sh && \
        sed -i 's/MODEL_NAME="yolo11n"/MODEL_NAME="yolo11s"/g' downloadAndQuantizeModel.sh && \
        rm -rf .modelenv && \
        python3 -m venv .modelenv && \
        source .modelenv/bin/activate && \
        pip3 install -r model_download_requirements.txt && \
        rm -rf models && \
        chmod +x downloadAndQuantizeModel.sh && \
        ./downloadAndQuantizeModel.sh && \
        rm ./downloadAndQuantizeModel.sh && \
        deactivate && \
        cd ../..
        echo "Downloading AIG (SDXL-Turbo & MiniLM) models"
        cd aig && \
        rm -rf .modelenv && \
        python3 -m venv .modelenv && \
        source ./.modelenv/bin/activate && \
        pip3 install -r export-requirements.txt && \
        export HF_HUB_ENABLE_HF_TRANSFER=1 && \
        optimum-cli export openvino --model stabilityai/sdxl-turbo --task stable-diffusion-xl --weight-format int8 ./models/sdxl_turbo_ov/int8 && \
        hf download sentence-transformers/all-MiniLM-L12-v2 --local-dir ./models/all-MiniLM-L12-v2 && \
        deactivate && \
        cd ../
    - name: Deploy
      run: |
        cd "${{ github.workspace }}"
        echo "Deploying digital-signage"
        make up
        sleep 60 # wait for containers to start and stabilize
        docker ps

    - name: Functional API smoke tests
      run: |
        cd "${{ github.workspace }}"
        HOST_IP=$(grep -m1 '^HOST_IP=' .env | cut -d '=' -f2)
        BASE_URL="https://${HOST_IP}:5000"

        check_status() {
          description="$1"
          url="$2"
          expected="$3" # space separated list of acceptable HTTP status codes
          for attempt in $(seq 1 10); do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
            for want in $expected; do
              if [ "$code" = "$want" ]; then
                echo "OK: $description ($url) -> $code"
                return 0
              fi
            done
            echo "Retry $attempt/10: $description ($url) -> $code (expected one of: $expected)"
            sleep 5
          done
          echo "FAIL: $description ($url) -> $code (expected one of: $expected)"
          return 1
        }

        status=0
        check_status "Web UI landing page" "$BASE_URL/" "200" || status=1
        check_status "Web UI portrait page" "$BASE_URL/portrait" "200" || status=1
        # No product may be on-screen yet, so a 204 (no ad yet) is an acceptable response.
        check_status "Web UI current advertisement endpoint" "$BASE_URL/get_current_advertisement?client_id=ci-smoke-test" "200 204" || status=1
        check_status "AIG health status endpoint" "$BASE_URL/aig-api/aig/hstatus/7" "200" || status=1
        check_status "AIG version endpoint" "$BASE_URL/aig-api/aig/versions" "200" || status=1

        exit $status

    - name: Check container logs for errors
      if: always()
      run: |
        for container in $(docker ps -aq); do
          logs=$(docker logs "$container" 2>&1)
          if echo "$logs" | grep -qi "error\|exception\|fail"; then
            echo "=== Logs for container: $container ==="
            echo "$logs" | tail -50
          fi
        done

    - name: Undeploy
      if: always()
      run: |
        cd "${{ github.workspace }}"
        make down
  
  digital-signage-scans:
    uses: ./.github/workflows/scans.yaml
    with:
      target: all-scans