[pytest]
testpaths = .
pythonpath = ..
addopts = --strict-markers
log_cli = true
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_file_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
markers =
    configuration: Offline Makefile configuration validation.
    live: Requires Docker and a stack started by the session fixture.
    api: Tests public endpoints through nginx.
    destructive: Resets containers or volumes; run only on a disposable deployment.
    stability: Observes continued operation or restart recovery.
    advertisements: Exercises controlled MQTT-to-advertisement delivery.
    security: Checks deployment security settings and HTTP headers.
    gpu: Runs PID and AIG image inference on an available GPU.
    npu: Runs PID and AIG image inference on an available NPU.