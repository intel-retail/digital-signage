<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Video Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        body { background: var(--bg); }

        /* ── Header ── */
        .header { padding: 0 28px; height: 60px; }
        .header h1 { font-size: 15px; letter-spacing: 1.5px; }

        /* ── Status badge ── */
        .status-badge { padding: 5px 12px; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; }

        /* ── Layout ── */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
            padding: 16px;
            gap: 16px;
        }

        /* ── Video section ── */
        .video-section {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
        }

        .video-section .card { flex: 1; display: flex; flex-direction: column; padding: 16px; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--foreground);
            letter-spacing: 0.2px;
        }

        /* ── Button component (adopted from ViPPET's button) ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--foreground);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover {
            background: var(--surface-alt);
            border-color: var(--brand-accent);
            color: var(--brand-primary);
        }

        .btn:active { transform: translateY(1px); }

        .control-buttons { display: flex; gap: 8px; }

        /* ── Video container ── */
        .video-container {
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-height: 300px;
        }

        .video-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.72);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.85);
        }

        /* ── Advertisement section ── */
        .product-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-section .card { flex: 1; display: flex; flex-direction: column; }

        /* ── Ad frame header (adopted from ViPPET's section header pattern) ── */
        .product-frame {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-frame-header {
            padding: 12px 16px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .product-frame-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── Image / ad area ── */
        .ad-image-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--surface);
        }

        .ad-image {
            width: 95%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Loading state (adopted from ViPPET's loading indicator) ── */
        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            flex-direction: column;
            gap: 14px;
        }

        .spinner { width: 36px; height: 36px; }

        .placeholder-text {
            font-size: 13px;
            color: var(--muted-fg);
            font-style: italic;
        }

        /* ── Footer ── */
        .footer { padding: 8px 28px; }

        @media (max-width: 1200px) {
            .main-container { flex-direction: column; }
            .video-section  { flex: 0 0 55%; }
            .product-section { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Context-Aware Cross-Selling Digital Signage</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="video-section">
            <div class="card">
                <div class="panel-header">
                    <span class="panel-title">Video Stream</span>
                    <div class="control-buttons">
                        <button id="reconnectBtn" class="btn">Reconnect</button>
                        <button id="fullscreenBtn" class="btn">Fullscreen</button>
                    </div>
                </div>
                <div class="video-container" id="videoContainer">
                    <iframe id="myframe"
                            style="width:100%; height:100%; border:0;"
                            allow="autoplay; encrypted-media"
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                    </iframe>
                    <div class="video-overlay" id="videoOverlay"></div>
                </div>
            </div>
        </div>

        <div class="product-section" id="myContainer">
            <div class="card" id="productFrame">
                <div class="product-frame">
                    <div class="product-frame-header">
                        <span class="product-frame-label">Generated Advertisement</span>
                    </div>
                    <div class="ad-image-container" id="ad-image-container">
                        <div id="aigServerLoading" class="image-placeholder">
                            <div class="spinner"></div>
                            <span class="placeholder-text">Waiting for initialization to complete...</span>
                        </div>
                        <img id="productImage" class="ad-image" src="" alt="Generated Product Advertisement" style="display: none;">
                        <div id="generationTime">Advertisement generated in 0s</div>
                        <div id="imagePlaceholder" class="image-placeholder"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        CACS Digital Signage System
    </div>

    <script src="/static/shared.js"></script>
    <script>
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            // Load Stream
            const streamOrigin = window.location.origin;
            document.getElementById("myframe").src = `${streamOrigin}/samplestream/`;
            updateConnectionStatus(true);
            // Start polling for advertisements
            startPolling();
        });

        function setupEventListeners() {
            document.getElementById("reconnectBtn").addEventListener("click", reconnectStream);
            document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
        }

        function reconnectStream() {
            const btn = document.getElementById('reconnectBtn');
            btn.textContent = 'Reconnecting...';
            btn.disabled = true;

            const iframe = document.getElementById("myframe");
            iframe.src = iframe.src;

            setTimeout(() => {
                btn.textContent = 'Reconnect';
                btn.disabled = false;
            }, 1500);
        }

        function toggleFullscreen() {
            const videoContainer = document.getElementById('videoContainer');

            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.error('Error attempting to enable fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function toggleOverlay() {
            const overlay = document.getElementById('videoOverlay');
            overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
