<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Video Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens aligned with the ViPPET design system ── */
        :root {
            --brand-primary:   #0054AE; /* Classic Blue */
            --brand-accent:    #0099EC; /* Classic Blue tint-1 */
            --brand-hover:     #004A9D; /* Classic Blue hover */
            --foreground:      #0F172A; /* slate-900 */
            --muted:           #64748B; /* slate-500 */
            --muted-fg:        #94A3B8; /* slate-400 */
            --border:          #CBD5E1; /* slate-300 */
            --bg:              #F4F5F5; /* spark-light-gray-100 */
            --surface:         #FFFFFF;
            --surface-alt:     #F8FAFC;
            --destructive:     #DA2E56; /* electric-coral */
            --success:         #9FD541; /* electric-moss */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', 'Open Sans', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--foreground);
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: var(--brand-primary);
            padding: 0 28px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* ── Status badge (adopted from ViPPET's badge component) ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            font-weight: 500;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--destructive);
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected { background: var(--success); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.45; }
        }

        /* ── Layout ── */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
            padding: 16px;
            gap: 16px;
        }

        /* ── Card component (adopted from ViPPET's card style) ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }

        /* ── Video section ── */
        .video-section {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
        }

        .video-section .card { flex: 1; display: flex; flex-direction: column; padding: 16px; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--foreground);
            letter-spacing: 0.2px;
        }

        /* ── Button component (adopted from ViPPET's button) ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--foreground);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover {
            background: var(--surface-alt);
            border-color: var(--brand-accent);
            color: var(--brand-primary);
        }

        .btn:active { transform: translateY(1px); }

        .control-buttons { display: flex; gap: 8px; }

        /* ── Video container ── */
        .video-container {
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-height: 300px;
        }

        .video-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.72);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.85);
        }

        /* ── Advertisement section ── */
        .product-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-section .card { flex: 1; display: flex; flex-direction: column; }

        /* ── Ad frame header (adopted from ViPPET's section header pattern) ── */
        .product-frame {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-frame-header {
            padding: 12px 16px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .product-frame-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── Image / ad area ── */
        .product-image-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--surface);
        }

        .product-image {
            width: 95%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Loading state (adopted from ViPPET's loading indicator) ── */
        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            flex-direction: column;
            gap: 14px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--brand-accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .placeholder-text {
            font-size: 13px;
            color: var(--muted-fg);
            font-style: italic;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Generation-time badge (adopted from ViPPET's status badge pattern) ── */
        #generationTime {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            border-radius: 6px;
            z-index: 10;
            display: none;
        }

        /* ── Footer ── */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--brand-primary);
            padding: 8px 28px;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.85);
        }

        @media (max-width: 1200px) {
            .main-container { flex-direction: column; }
            .video-section  { flex: 0 0 55%; }
            .product-section { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Context-Aware Cross-Selling Digital Signage</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="video-section">
            <div class="card">
                <div class="panel-header">
                    <span class="panel-title">Video Stream</span>
                    <div class="control-buttons">
                        <button id="reconnectBtn" class="btn">Reconnect</button>
                        <button id="fullscreenBtn" class="btn">Fullscreen</button>
                    </div>
                </div>
                <div class="video-container" id="videoContainer">
                    <iframe id="myframe"
                            style="width:100%; height:100%; border:0;"
                            allow="autoplay; encrypted-media"
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                    </iframe>
                    <div class="video-overlay" id="videoOverlay"></div>
                </div>
            </div>
        </div>

        <div class="product-section" id="myContainer">
            <div class="card" id="productFrame">
                <div class="product-frame">
                    <div class="product-frame-header">
                        <span class="product-frame-label">Generated Advertisement</span>
                    </div>
                    <div class="product-image-container" id="product-image-container">
                        <div id="aigServerLoading" class="image-placeholder">
                            <div class="spinner"></div>
                            <span class="placeholder-text">Waiting for initialization to complete...</span>
                        </div>
                        <img id="productImage" class="product-image" src="" alt="Generated Product Advertisement" style="display: none;">
                        <div id="generationTime">Advertisement generated in 0s</div>
                        <div id="imagePlaceholder" class="image-placeholder"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        CACS Digital Signage System
    </div>

    <script>
        let pollingInterval = null;
        let currentProduct = null;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            // Load Stream
            const streamOrigin = window.location.origin;
            document.getElementById("myframe").src = `${streamOrigin}/samplestream/`;
            updateConnectionStatus(true);
            // Start polling for advertisements
            startPolling();
        });

        function setupEventListeners() {
            document.getElementById("reconnectBtn").addEventListener("click", reconnectStream);
            document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollForAdvertisement();
            pollingInterval = setInterval(pollForAdvertisement, 2000);
        }

        function getBrowserFingerprint() {
            // Generate a simple client fingerprint based on browser characteristics
            const userAgent = navigator.userAgent;
            const screenResolution = `${screen.width}x${screen.height}`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const timestamp = performance.timeOrigin; // Unique per tab/window
            const random = Math.random().toString(36).substring(2); // Random component
            
            // Store or retrieve a unique tab ID from sessionStorage (unique per tab)
            let tabId = sessionStorage.getItem('tabId');
            if (!tabId) {
                tabId = `${Date.now()}_${random}`;
                sessionStorage.setItem('tabId', tabId);
            }
            
            const fingerprint = `${userAgent}_${screenResolution}_${timezone}_${timestamp}_${tabId}`;
            
            // Create a simple hash
            let hash = 0;
            for (let i = 0; i < fingerprint.length; i++) {
                const char = fingerprint.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }

        function pollForAdvertisement() {
            const container = document.getElementById("product-image-container");
            const rect = container.getBoundingClientRect();
            const width = Math.floor(rect.width);
            const height = Math.floor(rect.height);

            const timestamp = new Date().getTime();
            const clientId = getBrowserFingerprint();
            fetch(`/get_current_advertisement?width=${width}&height=${height}&client_id=${clientId}`)
                .then(res => {
                    if (res.status === 200) {
                        res.blob().then(imageBlob => {
                            // Get generation time from response header
                            const xgenerationTime = res.headers.get('X-Generation-Time');

                            // Create object URL for the image
                            const imageUrl = URL.createObjectURL(imageBlob);

                            // Update generation time display if header exists
                            if (xgenerationTime) {
                                const generationTimeElement = document.getElementById('generationTime');
                                generationTimeElement.textContent = `${xgenerationTime}`;
                                generationTimeElement.style.display = 'block';
                            }
                            // Display the generated image
                            const productImage = document.getElementById('productImage');
                            
                            const aigServerLoading = document.getElementById('aigServerLoading');
                        
                            productImage.src = imageUrl;
                            productImage.style.display = 'block';
                            
                            aigServerLoading.style.display = 'none';
                            
                        });
                    }
                    return;
                })
        }

        function generateProductAdvertisement(product) {
            // This function is now deprecated, handled by polling
            pollForAdvertisement();
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
            }
        }

        function reconnectStream() {
            const btn = document.getElementById('reconnectBtn');
            btn.textContent = 'Reconnecting...';
            btn.disabled = true;

            const iframe = document.getElementById("myframe");

            // Reload stream
            iframe.src = iframe.src;

            setTimeout(() => {
                btn.textContent = 'Reconnect';
                btn.disabled = false;
            }, 1500);
        }

        function toggleFullscreen() {
            const videoContainer = document.getElementById('videoContainer');
            
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => {
                    console.error('Error attempting to enable fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function toggleOverlay() {
            const overlay = document.getElementById('videoOverlay');
            overlay.style.display = overlay.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
