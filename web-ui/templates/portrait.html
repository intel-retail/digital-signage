<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Portrait Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        body { background: #000; width: 100vw; }

        /* ── Header ── */
        .header {
            padding: 0 20px;
            height: 52px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header h1 { font-size: 13px; letter-spacing: 1.2px; }

        /* ── Status badge ── */
        .status-badge { padding: 4px 10px; font-size: 11px; }
        .status-dot { width: 7px; height: 7px; }

        /* ── Ad container ── */
        .main-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
        }

        .advertisement-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* ── Ad section header (adopted from ViPPET's section header) ── */
        .ad-header {
            padding: 64px 20px 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .ad-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-primary);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .ad-subtitle {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 3px;
            font-weight: 400;
        }

        .ad-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ── Ad image card (adopted from ViPPET's card component) ── */
        .ad-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .ad-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Loading state (adopted from ViPPET's loading indicator) ── */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .spinner { width: 48px; height: 48px; }

        .loading-text {
            color: var(--muted-fg);
            font-size: 14px;
            text-align: center;
            font-style: italic;
        }

        /* ── Floating video window (card style from ViPPET) ── */
        .floating-video {
            position: fixed;
            bottom: 24px;
            left: 20px;
            width: 280px;
            height: 160px;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 1000;
            border: 1px solid var(--border);
            transition: width 0.25s ease, height 0.25s ease;
        }

        /* ── Floating video header (adopted from ViPPET's panel header) ── */
        .floating-video-header {
            background: var(--brand-primary);
            padding: 5px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            height: 30px;
        }

        .floating-video-title {
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .floating-video-controls {
            display: flex;
            gap: 4px;
        }

        .video-control-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .video-control-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .floating-video-content {
            width: 100%;
            height: calc(100% - 30px);
        }

        .floating-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Footer ── */
        .footer { padding: 7px 20px; z-index: 50; }

        @media (max-width: 768px) {
            .header h1 { font-size: 11px; }
            .floating-video { width: 200px; height: 115px; bottom: 15px; left: 15px; }
            .ad-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Context-Aware Cross-Selling Digital Signage</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="advertisement-container">
            <div class="ad-header">
                <div class="ad-title">Generated Advertisement</div>
                <div class="ad-subtitle">Context-Aware Cross-Selling — Portrait Mode</div>
            </div>
            <div class="ad-content">
                <div class="ad-image-container" id="ad-image-container">
                    <div id="aigServerLoading" class="loading-indicator">
                        <div class="spinner"></div>
                        <span class="loading-text">Waiting for initialization to complete...</span>
                    </div>
                    <img id="productImage" class="ad-image" src="" alt="Generated Product Advertisement" style="display: none;">
                    <div id="generationTime">Advertisement generated in 0s</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Video Window -->
    <div class="floating-video" id="floatingVideo">
        <div class="floating-video-header" id="videoHeader">
            <span class="floating-video-title">Live Stream</span>
            <div class="floating-video-controls">
                <button id="reconnectBtn" class="video-control-btn" title="Reconnect">⟳</button>
                <button id="expandBtn" class="video-control-btn" title="Expand">⛶</button>
            </div>
        </div>
        <div class="floating-video-content">
            <iframe id="myframe"
                    style="width:100%; height:100%; border:0;"
                    allow="autoplay; encrypted-media"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
            </iframe>
        </div>
    </div>

    <div class="footer">
        CACS Digital Signage System — Portrait Mode
    </div>

    <script src="/static/shared.js"></script>
    <script>
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            setupDraggable();

            // Load Stream
            const host = window.location.hostname;
            const STREAM_PORT = "8889";
            document.getElementById("myframe").src = `${window.location.protocol}//${host}:${STREAM_PORT}/samplestream/`;
            updateConnectionStatus(true);

            // Start polling for advertisements
            startPolling();
        });

        function setupEventListeners() {
            document.getElementById("reconnectBtn").addEventListener("click", reconnectStream);
            document.getElementById("expandBtn").addEventListener("click", expandVideo);
        }

        function setupDraggable() {
            const header = document.getElementById("videoHeader");

            header.addEventListener("mousedown", dragStart);
            document.addEventListener("mousemove", drag);
            document.addEventListener("mouseup", dragEnd);

            header.addEventListener("touchstart", dragStart);
            document.addEventListener("touchmove", drag);
            document.addEventListener("touchend", dragEnd);
        }

        function dragStart(e) {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            if (e.target.closest('#videoHeader')) {
                isDragging = true;
            }
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();

                const videoWindow = document.getElementById("floatingVideo");

                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                setTranslate(currentX, currentY, videoWindow);
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
        }

        function reconnectStream() {
            const btn = document.getElementById('reconnectBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '↻';
            btn.disabled = true;

            const iframe = document.getElementById("myframe");
            iframe.src = iframe.src;

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        }

        function expandVideo() {
            const videoWindow = document.getElementById("floatingVideo");
            const currentWidth = videoWindow.style.width || '280px';

            if (parseInt(currentWidth) === 280) {
                videoWindow.style.width = '420px';
                videoWindow.style.height = '240px';
            } else {
                videoWindow.style.width = '280px';
                videoWindow.style.height = '160px';
            }
        }
    </script>
</body>
</html>
