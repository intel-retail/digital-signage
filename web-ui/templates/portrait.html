<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Portrait Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens aligned with the ViPPET design system ── */
        :root {
            --brand-primary:   #0054AE; /* Classic Blue */
            --brand-accent:    #0099EC; /* Classic Blue tint-1 */
            --brand-hover:     #004A9D; /* Classic Blue hover */
            --foreground:      #0F172A; /* slate-900 */
            --muted:           #64748B; /* slate-500 */
            --muted-fg:        #94A3B8; /* slate-400 */
            --border:          #CBD5E1; /* slate-300 */
            --bg:              #F4F5F5; /* spark-light-gray-100 */
            --surface:         #FFFFFF;
            --surface-alt:     #F8FAFC;
            --destructive:     #DA2E56; /* electric-coral */
            --success:         #9FD541; /* electric-moss */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', 'Open Sans', 'Segoe UI', sans-serif;
            background: #000;
            color: var(--foreground);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: var(--brand-primary);
            padding: 0 20px;
            height: 52px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* ── Status badge (adopted from ViPPET's badge component) ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 500;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--destructive);
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected { background: var(--success); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.45; }
        }

        /* ── Ad container ── */
        .main-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
        }

        .advertisement-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* ── Ad section header (adopted from ViPPET's section header) ── */
        .ad-header {
            padding: 64px 20px 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .ad-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-primary);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .ad-subtitle {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 3px;
            font-weight: 400;
        }

        .ad-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ── Ad image card (adopted from ViPPET's card component) ── */
        .ad-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .ad-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ── Loading state (adopted from ViPPET's loading indicator) ── */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--brand-accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--muted-fg);
            font-size: 14px;
            text-align: center;
            font-style: italic;
        }

        /* ── Generation-time badge (adopted from ViPPET's badge pattern) ── */
        .generation-time {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            z-index: 10;
            display: none;
        }

        /* ── Floating video window (card style from ViPPET) ── */
        .floating-video {
            position: fixed;
            bottom: 24px;
            left: 20px;
            width: 280px;
            height: 160px;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 1000;
            border: 1px solid var(--border);
            transition: width 0.25s ease, height 0.25s ease;
        }

        /* ── Floating video header (adopted from ViPPET's panel header) ── */
        .floating-video-header {
            background: var(--brand-primary);
            padding: 5px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            height: 30px;
        }

        .floating-video-title {
            color: #ffffff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .floating-video-controls {
            display: flex;
            gap: 4px;
        }

        .video-control-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .video-control-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .floating-video-content {
            width: 100%;
            height: calc(100% - 30px);
        }

        .floating-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Footer ── */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--brand-primary);
            padding: 7px 20px;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.85);
            z-index: 50;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 11px; }
            .floating-video { width: 200px; height: 115px; bottom: 15px; left: 15px; }
            .ad-title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Context-Aware Cross-Selling Digital Signage</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="advertisement-container">
            <div class="ad-header">
                <div class="ad-title">Generated Advertisement</div>
                <div class="ad-subtitle">Context-Aware Cross-Selling — Portrait Mode</div>
            </div>
            <div class="ad-content">
                <div class="ad-image-container" id="ad-image-container">
                    <div id="aigServerLoading" class="loading-indicator">
                        <div class="spinner"></div>
                        <span class="loading-text">Waiting for initialization to complete...</span>
                    </div>
                    <img id="productImage" class="ad-image" src="" alt="Generated Product Advertisement" style="display: none;">
                    <div id="generationTime" class="generation-time">Advertisement generated in 0s</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Video Window -->
    <div class="floating-video" id="floatingVideo">
        <div class="floating-video-header" id="videoHeader">
            <span class="floating-video-title">Live Stream</span>
            <div class="floating-video-controls">
                <button id="reconnectBtn" class="video-control-btn" title="Reconnect">⟳</button>
                <button id="expandBtn" class="video-control-btn" title="Expand">⛶</button>
            </div>
        </div>
        <div class="floating-video-content">
            <iframe id="myframe"
                    style="width:100%; height:100%; border:0;"
                    allow="autoplay; encrypted-media"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
            </iframe>
        </div>
    </div>

    <div class="footer">
        CACS Digital Signage System — Portrait Mode
    </div>

    <script>
        let pollingInterval = null;
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            setupDraggable();
            
            // Load Stream
            const host = window.location.hostname;
            const STREAM_PORT = "8889";
            document.getElementById("myframe").src = `${window.location.protocol}//${host}:${STREAM_PORT}/samplestream/`;
            updateConnectionStatus(true);
            
            // Start polling for advertisements
            startPolling();
        });

        function setupEventListeners() {
            document.getElementById("reconnectBtn").addEventListener("click", reconnectStream);
            document.getElementById("expandBtn").addEventListener("click", expandVideo);
        }

        function setupDraggable() {
            const videoWindow = document.getElementById("floatingVideo");
            const header = document.getElementById("videoHeader");

            header.addEventListener("mousedown", dragStart);
            document.addEventListener("mousemove", drag);
            document.addEventListener("mouseup", dragEnd);

            header.addEventListener("touchstart", dragStart);
            document.addEventListener("touchmove", drag);
            document.addEventListener("touchend", dragEnd);
        }

        function dragStart(e) {
            const videoWindow = document.getElementById("floatingVideo");
            
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            if (e.target.closest('#videoHeader')) {
                isDragging = true;
            }
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                
                const videoWindow = document.getElementById("floatingVideo");
                
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                setTranslate(currentX, currentY, videoWindow);
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollForAdvertisement();
            pollingInterval = setInterval(pollForAdvertisement, 2000);
        }

        function getBrowserFingerprint() {
            const userAgent = navigator.userAgent;
            const screenResolution = `${screen.width}x${screen.height}`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const timestamp = performance.timeOrigin;
            const random = Math.random().toString(36).substring(2);
            
            let tabId = sessionStorage.getItem('tabId');
            if (!tabId) {
                tabId = `${Date.now()}_${random}`;
                sessionStorage.setItem('tabId', tabId);
            }
            
            const fingerprint = `${userAgent}_${screenResolution}_${timezone}_${timestamp}_${tabId}`;
            
            let hash = 0;
            for (let i = 0; i < fingerprint.length; i++) {
                const char = fingerprint.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }

        function pollForAdvertisement() {
            const container = document.getElementById("ad-image-container");
            const rect = container.getBoundingClientRect();
            const width = Math.floor(rect.width);
            const height = Math.floor(rect.height);

            const timestamp = new Date().getTime();
            const clientId = getBrowserFingerprint();
            
            fetch(`/get_current_advertisement?width=${width}&height=${height}&client_id=${clientId}`)
                .then(res => {
                    if (res.status === 200) {
                        res.blob().then(imageBlob => {
                            const xgenerationTime = res.headers.get('X-Generation-Time');
                            const imageUrl = URL.createObjectURL(imageBlob);

                            if (xgenerationTime) {
                                const generationTimeElement = document.getElementById('generationTime');
                                generationTimeElement.textContent = `${xgenerationTime}`;
                                generationTimeElement.style.display = 'block';
                            }
                            
                            const productImage = document.getElementById('productImage');
                            const aigServerLoading = document.getElementById('aigServerLoading');
                        
                            productImage.src = imageUrl;
                            productImage.style.display = 'block';
                            aigServerLoading.style.display = 'none';
                        });
                    }
                    return;
                })
                .catch(err => {
                    console.error('Error fetching advertisement:', err);
                });
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
            }
        }

        function reconnectStream() {
            const btn = document.getElementById('reconnectBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '↻';
            btn.disabled = true;

            const iframe = document.getElementById("myframe");
            iframe.src = iframe.src;

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        }

        function expandVideo() {
            const videoWindow = document.getElementById("floatingVideo");
            const currentWidth = videoWindow.style.width || '280px';
            
            if (parseInt(currentWidth) === 280) {
                videoWindow.style.width = '420px';
                videoWindow.style.height = '240px';
            } else {
                videoWindow.style.width = '280px';
                videoWindow.style.height = '160px';
            }
        }
    </script>
</body>
</html>
